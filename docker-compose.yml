# Конструктор КП на сервері: docker compose up -d --build (докладно: docs/DEPLOY.md).
# Значення змінних беруться з файлу .env поруч (зразок: .env.example).
services:
  kp:
    build: .
    image: kp-configurator:latest
    restart: unless-stopped
    init: true
    ports:
      - "${KP_HOST_PORT:-8080}:8080"
    environment:
      KP_ADMIN_TOKEN: "${KP_ADMIN_TOKEN:?задайте KP_ADMIN_TOKEN у файлі .env (зразок .env.example)}"
      KP_ACCESS_TOKEN: "${KP_ACCESS_TOKEN:-}"
      TZ: Europe/Kyiv
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
