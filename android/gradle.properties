org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Build-time options (override with -P on the command line):
# kp.serverUrl   default server address baked into BuildConfig.SERVER_URL (empty = ask on first launch)
# kp.versionCode integer version code (CI passes the run number)
# kp.versionName human-readable version
kp.serverUrl=
kp.versionCode=1
kp.versionName=0.1.0
